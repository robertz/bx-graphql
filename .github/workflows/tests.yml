name: Tests

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: ortus-boxlang/setup-boxlang@main
        with:
          version: 1.19.0
          modules: bx-compat-cfml
          with-commandbox: true

      # testbox/ is gitignored: box.json's devDependencies put it back
      - name: Install TestBox
        run: box install

      - name: Link the module into boxlang_modules
        run: boxlang setup-tests.bxs

      - name: Run specs
        run: boxlang run-tests.bxs
